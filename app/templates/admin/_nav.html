{# Navegação do painel do restaurante, com os mesmos rótulos, ícones e seções do
   menu da Gestão do Borba's Burguer.

   Usa `g.tenant` (e não a variável `tenant` de cada tela) porque é o base.html
   que inclui este arquivo, e não cada página.

   Diferença em relação ao original: lá cada item era um <button> que trocava de
   aba; aqui é um <a> que troca de rota, porque o bloqueio por plano é por rota.
   A classe `.tab-btn` é a mesma, então o menu sai idêntico.

   Recurso que o plano não inclui não aparece: a rota também barra, mas oferecer
   para depois negar seria pior do que não oferecer. #}
{% set atual = request.endpoint or "" %}
<nav class="v17-nav">
  <span class="v17-nav-label">Visão geral</span>
  <a class="tab-btn {{ 'active' if atual == 'admin.dashboard' }}" href="{{ url_for('admin.dashboard') }}">
    <span>⌁</span> Monitor
  </a>
  {% if libera('cozinha') %}
    <a class="tab-btn {{ 'active' if atual.startswith('operacao.cozinha') or atual == 'operacao.pedido_status' }}" href="{{ url_for('operacao.cozinha') }}">
      <span>🔥</span> Cozinha
    </a>
  {% endif %}
  {% if libera('relatorios') %}
    <a class="tab-btn {{ 'active' if atual == 'admin.relatorios' }}" href="{{ url_for('admin.relatorios') }}">
      <span>▥</span> Vendas
    </a>
  {% endif %}

  <a class="tab-btn {{ 'active' if atual.startswith('entregas.') }}" href="{{ url_for('entregas.lista') }}">
    <span>🛵</span> Entregas
  </a>

  {% if libera('mesas') and g.tenant.atende_mesa %}
    <span class="v17-nav-label">Atendimento</span>
    <a class="tab-btn {{ 'active' if atual.startswith('operacao.mesa') }}" href="{{ url_for('operacao.mesas') }}">
      <span>▦</span> Mesas
    </a>
  {% endif %}

  <span class="v17-nav-label">Cardápio e campanhas</span>
  <a class="tab-btn {{ 'active' if atual in ('admin.produtos', 'admin.produto_editar', 'admin.produto_ficha') }}" href="{{ url_for('admin.produtos') }}">
    <span>◫</span> Produtos
  </a>
  <a class="tab-btn {{ 'active' if atual == 'admin.categorias' }}" href="{{ url_for('admin.categorias') }}">
    <span>▤</span> Categorias
  </a>
  <a class="tab-btn {{ 'active' if atual == 'admin.adicionais' }}" href="{{ url_for('admin.adicionais') }}">
    <span>✦</span> Adicionais
  </a>
  {% if libera('cupons') %}
    <a class="tab-btn {{ 'active' if atual == 'admin.cupons' }}" href="{{ url_for('admin.cupons') }}">
      <span>◆</span> Cupons
    </a>
  {% endif %}

  <span class="v17-nav-label">Operação</span>
  {% if libera('bairros') %}
    <a class="tab-btn {{ 'active' if atual == 'admin.bairros' }}" href="{{ url_for('admin.bairros') }}">
      <span>⌖</span> Bairros e taxas
    </a>
  {% endif %}
  {% if libera('estoque') %}
    <a class="tab-btn {{ 'active' if atual == 'admin.insumos' }}" href="{{ url_for('admin.insumos') }}">
      <span>▣</span> Estoque
      {% set repor = insumos_para_repor() %}
      {% if repor %}<b class="v17-nav-count" title="Insumos para repor">{{ repor }}</b>{% endif %}
    </a>
  {% endif %}
  {% if libera('custos') %}
    <a class="tab-btn {{ 'active' if atual in ('admin.custos', 'admin.produto_ficha') }}" href="{{ url_for('admin.custos') }}">
      <span>◒</span> Custos
    </a>
  {% endif %}

  <span class="v17-nav-label">Administração</span>
  {% if libera('financeiro') %}
    <a class="tab-btn {{ 'active' if atual == 'admin.financeiro' }}" href="{{ url_for('admin.financeiro') }}">
      <span>▤</span> Financeiro
    </a>
  {% endif %}
  {% if libera('impressao') %}
    <a class="tab-btn {{ 'active' if atual.startswith('admin.impressao') }}" href="{{ url_for('admin.impressao') }}">
      <span>⎙</span> Impressão
      {% set na_fila = comandas_na_fila() %}
      {% if na_fila %}<b class="v17-nav-count" title="Comandas esperando a impressora">{{ na_fila }}</b>{% endif %}
    </a>
  {% endif %}
  <a class="tab-btn {{ 'active' if atual.startswith('admin.equipe') }}" href="{{ url_for('admin.equipe') }}">
    <span>◍</span> Equipe
  </a>
  <a class="tab-btn {{ 'active' if atual == 'admin.atividade' }}" href="{{ url_for('admin.atividade') }}">
    <span>◷</span> Atividade
  </a>
  <a class="tab-btn {{ 'active' if atual == 'admin.configuracoes' }}" href="{{ url_for('admin.configuracoes') }}">
    <span>◎</span> Loja e identidade
  </a>
</nav>

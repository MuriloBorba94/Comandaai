{# Navegação da área da plataforma, com o mesmo desenho de menu da Gestão. #}
{% set atual = request.endpoint or "" %}
<nav class="v17-nav">
  <span class="v17-nav-label">Visão geral</span>
  <a class="tab-btn {{ 'active' if atual == 'platform.inicio' }}" href="{{ url_for('platform.inicio') }}">
    <span>⌂</span> Início
  </a>

  <span class="v17-nav-label">Clientes</span>
  <a class="tab-btn {{ 'active' if atual in ('platform.tenants_list', 'platform.tenant_editar') }}" href="{{ url_for('platform.tenants_list') }}">
    <span>▦</span> Tenants
  </a>
  <a class="tab-btn {{ 'active' if atual == 'platform.tenant_new' }}" href="{{ url_for('platform.tenant_new') }}">
    <span>✦</span> Novo tenant
  </a>

  <span class="v17-nav-label">Assinatura</span>
  <a class="tab-btn {{ 'active' if atual == 'platform.cobrancas' }}" href="{{ url_for('platform.cobrancas') }}">
    <span>◒</span> Cobranças
  </a>
  <a class="tab-btn {{ 'active' if atual == 'platform.planos' }}" href="{{ url_for('platform.planos') }}">
    <span>◆</span> Planos
  </a>
</nav>

{% extends "base.html" %}
{% block title %}Login da plataforma{% endblock %}
{% block header_title %}Comanda ai — Plataforma{% endblock %}
{% block content %}
  <div class="pagina-centrada">
    <div class="card-admin">
      <h1>Comanda ai</h1>
      <p class="muted">Administração da plataforma.</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Usuário</label>
        <input id="username" name="username" required autofocus autocomplete="username">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>
{% endblock %}
